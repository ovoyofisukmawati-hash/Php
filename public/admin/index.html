<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --panel-soft: #172033;
      --card: #1d2940;
      --muted: #93a3b8;
      --text: #edf2ff;
      --primary: #4f8cff;
      --primary-dark: #2d6cdf;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 16px 30px rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0b1220, #101827);
      color: var(--text);
    }

    .hidden { display: none !important; }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 420px);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }

    .brand {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .subtext {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    input, select, button, textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(79, 140, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(79,140,255,0.18);
    }

    button {
      cursor: pointer;
      border: none;
      transition: 0.2s ease;
      font-weight: 700;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .primary-btn:hover { filter: brightness(1.06); }

    .secondary-btn {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .danger-btn {
      background: rgba(239,68,68,0.15);
      color: #ffc1c1;
    }

    .success-btn {
      background: rgba(34,197,94,0.18);
      color: #b8f6cf;
    }

    .app-shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17,24,39,0.78);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
    }

    .topbar-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .user-pill {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }

    .card {
      background: linear-gradient(180deg, rgba(29,41,64,1), rgba(17,24,39,0.9));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .card .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .card .value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .panel {
      background: rgba(17,24,39,0.82);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .panel h3 {
      margin: 0;
      font-size: 19px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 13px;
    }

    th {
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .table-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-btn {
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      min-width: 80px;
    }

    .layout-two {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 24px;
    }

    form .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
      gap: 10px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-active { background: rgba(34,197,94,0.15); color: #b8f6cf; }
    .status-pending { background: rgba(245,158,11,0.15); color: #f8d892; }
    .status-blocked, .status-rejected { background: rgba(239,68,68,0.15); color: #ffc1c1; }
    .status-approved { background: rgba(34,197,94,0.15); color: #b8f6cf; }
    .status-suspended { background: rgba(148,163,184,0.15); color: #dfe7f2; }

    .muted { color: var(--muted); }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      background: rgba(17,24,39,0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      transition: 0.25s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 860px) {
      .layout-two { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand">Admin Panel</div>
      <div class="subtext">Masuk ke dashboard investasi</div>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email</label>
          <input id="email" type="email" value="admin@example.com" required />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input id="password" type="password" value="admin123" required />
        </div>

        <button class="primary-btn" type="submit" style="margin-top: 8px;">Login</button>
      </form>
    </div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <h1>Dashboard Admin</h1>
      <div class="topbar-right">
        <div id="userPill" class="user-pill">Admin</div>
        <button id="logoutBtn" class="secondary-btn" style="padding: 10px 16px;">Logout</button>
      </div>
    </header>

    <section id="summaryGrid" class="grid"></section>

    <section class="panel">
      <div class="panel-head">
        <h3>Daftar Pengguna</h3>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nama</th>
              <th>Email</th>
              <th>Status</th>
              <th>Role</th>
              <th>Saldo</th>
              <th>Ubah Status</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h3>Transaksi</h3>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Deskripsi</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="transactionsTableBody"></tbody>
        </table>
      </div>
    </section>

    <div class="layout-two">
      <section class="panel">
        <div class="panel-head">
          <h3>Skema Investasi</h3>
        </div>
        <div style="overflow-x:auto; margin-bottom: 20px;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Min</th>
                <th>Bunga</th>
                <th>Durasi</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="plansTableBody"></tbody>
          </table>
        </div>

        <form id="planForm">
          <div class="form-grid">
            <div>
              <label>Nama</label>
              <input id="planName" type="text" placeholder="Nama plan" />
            </div>
            <div>
              <label>Minimum Amount</label>
              <input id="planMinimumAmount" type="number" step="0.01" placeholder="5000000" />
            </div>
            <div>
              <label>Interest Rate</label>
              <input id="planInterestRate" type="number" step="0.01" placeholder="12.5" />
            </div>
            <div>
              <label>Duration Days</label>
              <input id="planDurationDays" type="number" placeholder="30" />
            </div>
            <div>
              <label>Deskripsi</label>
              <textarea id="planDescription" placeholder="Deskripsi plan"></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" id="resetPlanForm" class="secondary-btn">Reset</button>
            <button type="submit" class="primary-btn">Simpan Plan</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h3>Pengaturan Aplikasi</h3>
        </div>

        <form id="settingsForm">
          <div class="input-group">
            <label for="siteName">Site Name</label>
            <input id="siteName" type="text" />
          </div>

          <div class="input-group">
            <label for="currency">Currency</label>
            <input id="currency" type="text" />
          </div>

          <div class="input-group">
            <label for="timezone">Timezone</label>
            <input id="timezone" type="text" />
          </div>

          <div class="input-group">
            <label for="maintenanceMode">Maintenance Mode</label>
            <select id="maintenanceMode">
              <option value="0">Off</option>
              <option value="1">On</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="primary-btn">Simpan</button>
          </div>
        </form>
      </section>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const state = {
      token: localStorage.getItem('adminToken') || '',
      user: JSON.parse(localStorage.getItem('adminUser') || 'null'),
      settings: {},
      planEditId: null
    };

    const $ = (selector) => document.querySelector(selector);

    const toast = (msg, type = 'info') => {
      const el = $('#toast');
      el.textContent = msg;
      el.style.borderColor = type === 'error' ? 'rgba(239,68,68,0.6)' : 'rgba(79,140,255,0.6)';
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    };

    function renderAuthState() {
      const loggedIn = !!state.token;
      $('#loginScreen').classList.toggle('hidden', loggedIn);
      $('#app').classList.toggle('hidden', !loggedIn);

      if (loggedIn) {
        $('#userPill').textContent = state.user ? state.user.name || state.user.email : 'Admin';
      }
    }

    async function apiFetch(url, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };

      if (state.token) {
        headers['Authorization'] = `Bearer ${state.token}`;
      }

      const response = await fetch(url, {
        ...options,
        headers
      });

      const json = await response.json();

      if (!response.ok || (json && json.success === false)) {
        const msg = json?.message || 'Request failed';
        throw new Error(msg);
      }

      return json;
    }

    async function login(event) {
      event.preventDefault();
      const email = $('#email').value.trim();
      const password = $('#password').value.trim();

      try {
        const res = await apiFetch('../auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        const token = res.data.token;
        const user = res.data.user;

        state.token = token;
        state.user = user;
        localStorage.setItem('adminToken', token);
        localStorage.setItem('adminUser', JSON.stringify(user));

        renderAuthState();
        loadAll();
        toast('Login berhasil');
      } catch (error) {
        toast(error.message || 'Login gagal', 'error');
      }
    }

    function logout() {
      state.token = '';
      state.user = null;
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminUser');
      renderAuthState();
      toast('Logout berhasil');
    }

    function formatCurrency(value) {
      const num = Number(value || 0);
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(num);
    }

    function setStatusBadge(value) {
      const normalized = String(value || '').toLowerCase();
      let className = 'status-pending';
      if (normalized === 'active' || normalized === 'approved') className = 'status-active';
      if (normalized === 'suspended') className = 'status-suspended';
      if (normalized === 'blocked' || normalized === 'rejected') className = 'status-blocked';
      if (normalized === 'pending') className = 'status-pending';
      return `<span class="status-badge ${className}">${value || '-'}</span>`;
    }

    function renderSummary(summary = {}) {
      const cards = [
        ['Total Users', summary.total_users ?? 0],
        ['Active Users', summary.active_users ?? 0],
        ['Total Balance', formatCurrency(summary.total_balance ?? 0)],
        ['Pending Transactions', summary.pending_transactions ?? 0],
        ['Total Deposit', formatCurrency(summary.total_deposit ?? 0)],
        ['Total Withdrawal', formatCurrency(summary.total_withdrawal ?? 0)]
      ];

      $('#summaryGrid').innerHTML = cards.map(([label, value]) => `
        <div class="card">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </div>
      `).join('');
    }

    async function loadDashboard() {
      try {
        const res = await apiFetch('../admin/dashboard');
        renderSummary(res.data.summary || {});
      } catch (error) {
        toast(error.message || 'Gagal memuat dashboard', 'error');
      }
    }

    async function loadUsers() {
      try {
        const res = await apiFetch('../admin/users');
        const users = res.data.users || [];

        $('#usersTableBody').innerHTML = users.map((user) => `
          <tr>
            <td>${user.id}</td>
            <td>${user.name || '-'}</td>
            <td>${user.email || '-'}</td>
            <td>${setStatusBadge(user.status)}</td>
            <td>${user.role || 'user'}</td>
            <td>${formatCurrency(user.balance || 0)}</td>
            <td>
              <select data-user-id="${user.id}" class="status-select">
                <option value="active" ${user.status === 'active' ? 'selected' : ''}>active</option>
                <option value="pending" ${user.status === 'pending' ? 'selected' : ''}>pending</option>
                <option value="suspended" ${user.status === 'suspended' ? 'selected' : ''}>suspended</option>
                <option value="blocked" ${user.status === 'blocked' ? 'selected' : ''}>blocked</option>
              </select>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('.status-select').forEach((select) => {
          select.addEventListener('change', async (event) => {
            const userId = Number(event.target.dataset.userId);
            const status = event.target.value;

            try {
              await apiFetch('../admin/users/' + userId + '/status', {
                method: 'PUT',
                body: JSON.stringify({ user_id: userId, status })
              });
              toast('Status user berhasil diubah');
              loadUsers();
            } catch (error) {
              toast(error.message || 'Gagal mengubah status', 'error');
            }
          });
        });
      } catch (error) {
        toast(error.message || 'Gagal memuat pengguna', 'error');
      }
    }

    async function loadTransactions() {
      try {
        const res = await apiFetch('../admin/transactions');
        const txs = res.data.transactions || [];

        $('#transactionsTableBody').innerHTML = txs.map((tx) => `
          <tr>
            <td>${tx.id}</td>
            <td>${tx.user_id || '-'}</td>
            <td>${tx.type || '-'}</td>
            <td>${formatCurrency(tx.amount || 0)}</td>
            <td>${setStatusBadge(tx.status)}</td>
            <td>${tx.description || '-'}</td>
            <td>
              <div class="table-actions">
                <button class="mini-btn success-btn" data-action="approve" data-transaction-id="${tx.id}">Approve</button>
                <button class="mini-btn danger-btn" data-action="reject" data-transaction-id="${tx.id}">Reject</button>
              </div>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('[data-action]').forEach((button) => {
          button.addEventListener('click', async () => {
            const transactionId = Number(button.dataset.transactionId);
            const action = button.dataset.action;

            try {
              const url = action === 'approve'
                ? '../admin/transactions/' + transactionId + '/approve'
                : '../admin/transactions/' + transactionId + '/reject';

              await apiFetch(url, {
                method: 'POST',
                body: JSON.stringify({
                  transaction_id: transactionId,
                  admin_id: state.user?.id || 1,
                  reason: action === 'reject' ? 'Ditolak dari admin panel' : ''
                })
              });

              toast(action === 'approve' ? 'Transaksi disetujui' : 'Transaksi ditolak');
              loadTransactions();
              loadDashboard();
            } catch (error) {
              toast(error.message || 'Gagal mengubah transaksi', 'error');
            }
          });
        });
      } catch (error) {
        toast(error.message || 'Gagal memuat transaksi', 'error');
      }
    }

    async function loadPlans() {
      try {
        const res = await apiFetch('../admin/investment-plans');
        const plans = res.data.plans || [];

        $('#plansTableBody').innerHTML = plans.map((plan) => `
          <tr>
            <td>${plan.id}</td>
            <td>${plan.name || '-'}</td>
            <td>${formatCurrency(plan.minimum_amount || 0)}</td>
            <td>${Number(plan.interest_rate || 0)}%</td>
            <td>${plan.duration_days || 0} hari</td>
            <td>${setStatusBadge(plan.is_active ? 'active' : 'inactive')}</td>
            <td>
              <div class="table-actions">
                <button class="mini-btn secondary-btn" data-plan-edit="${plan.id}">Edit</button>
              </div>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('[data-plan-edit]').forEach((button) => {
          button.addEventListener('click', () => {
            const id = Number(button.dataset.planEdit);
            const plan = (res.data.plans || []).find((p) => Number(p.id) === id);
            if (!plan) return;

            state.planEditId = id;
            $('#planName').value = plan.name || '';
            $('#planMinimumAmount').value = plan.minimum_amount || 0;
            $('#planInterestRate').value = plan.interest_rate || 0;
            $('#planDurationDays').value = plan.duration_days || 0;
            $('#planDescription').value = plan.description || '';
            $('#planForm button[type="submit"]').textContent = 'Update Plan';
          });
        });
      } catch (error) {
        toast(error.message || 'Gagal memuat plan investasi', 'error');
      }
    }

    async function loadSettings() {
      try {
        const res = await apiFetch('../admin/settings');
        const settings = res.data.settings || {};
        state.settings = settings;

        $('#siteName').value = settings.site_name || '';
        $('#currency').value = settings.currency || 'IDR';
        $('#timezone').value = settings.timezone || 'Asia/Jakarta';
        $('#maintenanceMode').value = settings.maintenance_mode === '1' || settings.maintenance_mode === true ? '1' : '0';
      } catch (error) {
        toast(error.message || 'Gagal memuat pengaturan', 'error');
      }
    }

    async function submitPlan(event) {
      event.preventDefault();
      const payload = {
        name: $('#planName').value.trim(),
        minimum_amount: Number($('#planMinimumAmount').value || 0),
        interest_rate: Number($('#planInterestRate').value || 0),
        duration_days: Number($('#planDurationDays').value || 0),
        description: $('#planDescription').value.trim(),
        is_active: 1
      };

      if (state.planEditId) payload.id = state.planEditId;

      try {
        await apiFetch('../admin/investment-plans', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        toast('Plan berhasil disimpan');
        resetPlanForm();
        loadPlans();
      } catch (error) {
        toast(error.message || 'Gagal menyimpan plan', 'error');
      }
    }

    function resetPlanForm() {
      state.planEditId = null;
      $('#planForm').reset();
      $('#planForm button[type="submit"]').textContent = 'Simpan Plan';
    }

    async function submitSettings(event) {
      event.preventDefault();

      const payload = {
        site_name: $('#siteName').value.trim(),
        currency: $('#currency').value.trim(),
        timezone: $('#timezone').value.trim(),
        maintenance_mode: $('#maintenanceMode').value === '1'
      };

      try {
        await apiFetch('../admin/settings', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        toast('Pengaturan berhasil disimpan');
      } catch (error) {
        toast(error.message || 'Gagal menyimpan pengaturan', 'error');
      }
    }

    async function loadAll() {
      if (!state.token) return;
      await Promise.all([
        loadDashboard(),
        loadUsers(),
        loadTransactions(),
        loadPlans(),
        loadSettings()
      ]);
    }

    $('#loginForm').addEventListener('submit', login);
    $('#logoutBtn').addEventListener('click', logout);
    $('#planForm').addEventListener('submit', submitPlan);
    $('#resetPlanForm').addEventListener('click', resetPlanForm);
    $('#settingsForm').addEventListener('submit', submitSettings);

    renderAuthState();

    if (state.token) {
      loadAll();
    }
  </script>
</body>
</html>
